# Minimal distro for IMX585 + CEF168 bring-up on Jetson Orin Nano.
#
# Derived from OE4T's "tegrademo" distro, with the tegra-demo-distro-specific
# machinery removed (tegra-support-sanity, distro_layer_buildinfo and the
# REQUIRED_TD_BBLAYERS_CONF_VERSION check) so this tree does not depend on
# meta-tegra-support or the setup-env wrapper.

DISTRO = "imx585"
DISTRO_NAME = "IMX585 Jetson bring-up"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "wrynose"
SDK_VENDOR = "-imx585sdk"

MAINTAINER = "Nathan Howell <nathanhowell@hotmail.com>"

TARGET_VENDOR = "-oe4t"

# wrynose removed DISTRO_FEATURES_DEFAULT and DISTRO_FEATURES_BACKFILL -- both
# are entries in oe-core's BB_RENAMED_VARIABLES now, so referring to either is a
# parse error rather than an empty expansion. The defaults live in
# DISTRO_FEATURES_DEFAULTS and bitbake.conf appends them to DISTRO_FEATURES by
# itself (oe.utils.filter_default_features), so only the additions belong here.
# opengl, wayland, vulkan, multiarch and ptest are already in the defaults;
# glvnd is appended for tegra by meta-tegra's libglvnd bbappend; largefile is no
# longer referenced anywhere in oe-core.
#
# virtualization is inert unless meta-virtualization is in bblayers, and it is
# what both container engines and meta-tegra's nvidia-container-toolkit gate on
# (REQUIRED_DISTRO_FEATURES), so it lives here rather than in the kas include
# that adds the layer -- that keeps DISTRO_FEATURES identical across all builds
# of this distro.
# tpm2 is required by meta-tpm, not optional decoration. Without it bitbake warns
#   "You have included the meta-tpm layer, but 'tpm or tpm2' has not been enabled
#    in your DISTRO_FEATURES. Some bbappend files and preferred version setting
#    may not take effect."
# tpm2-tss and tpm2-tools would still build, but meta-tpm's bbappends and its
# PREFERRED_VERSION pins silently would not apply -- and this distro's whole
# fTPM story (OPTEE_ENABLE_FTPM below) depends on that stack.
DISTRO_FEATURES ?= "systemd pam usrmerge virtualization tpm2"

# Opting out replaces DISTRO_FEATURES:remove. Headless target: no display server
# of either kind, and nothing that would use Vulkan.
#
# opengl stays, deliberately, despite being headless. It is not a display
# feature here -- it is the gate (REQUIRED_DISTRO_FEATURES = "opengl") on
# tegra-mmapi, which is Argus, and on the NVIDIA gstreamer plugins. Section 8.2
# of IMX585-YOCTO-NOTES.md keeps the tegracam/Argus path open, and dropping
# opengl would make it unbuildable rather than merely uninstalled.
#
# ldconfig also stays: libnvidia-container RDEPENDS the ldconfig package.
DISTRO_FEATURES_OPTED_OUT ?= "ptest pulseaudio 3g nfc x11 wayland vulkan"

# Most NVIDIA-supplied services expect systemd.
INIT_MANAGER = "systemd"

PACKAGE_CLASSES ?= "package_rpm"

BB_SIGNATURE_HANDLER ?= "OEEquivHash"
BB_HASHSERVE ??= "auto"

# no-static-libs.inc, yocto-uninative.inc and security_flags.inc are NOT required
# here. wrynose's conf/distro/defaultsetup.conf already includes all three, and
# requiring them again produced three "Duplicate inclusion" warnings per parse:
#   WARNING: Duplicate inclusion for .../no-static-libs.inc in .../defaultsetup.conf
# INHERIT += "uninative" is likewise redundant, though not for that reason:
# yocto-uninative.inc only sets UNINATIVE_URL/UNINATIVE_CHECKSUM. The inherit
# comes from defaultsetup.conf's INHERIT_DISTRO ?= "... uninative", which applies
# because this distro does not set INHERIT_DISTRO itself.
# Carried over from tegrademo.conf, which predates that consolidation.

USE_REDUNDANT_FLASH_LAYOUT_DEFAULT ?= "1"

# Where the persistent data partition is mounted. Global because three unrelated
# things need to agree on it: imx585-node-config (the mount unit, dropbear host
# keys), podman's graphroot, and OP-TEE secure storage below.
IMX585_DATA_MOUNT ?= "/data"

# NVIDIA's firmware TPM 2.0: the Microsoft ms-tpm-20-ref implementation running as
# an OP-TEE trusted application. meta-tegra defaults this on for tegra264 (Thor)
# and off for tegra234, but Orin supports it -- optee-ftpm is COMPATIBLE_MACHINE
# tegra and builds with CFG_TA_MEASURED_BOOT=y and CFG_USE_PLATFORM_EPS=y, so the
# endorsement seed is derived from this module's fuses.
#
# This changes the OP-TEE binary, because the fTPM and its helper go in as early
# TAs (EARLY_TA_PATHS in optee-os). The TOS partition has to be rewritten --
# tegraflash or a capsule/BUP update -- not just the rootfs.
OPTEE_ENABLE_FTPM = "1"

# OP-TEE secure storage, and the trap in enabling the fTPM on a read-only rootfs.
# optee-client defaults CFG_TEE_FS_PARENT_PATH to ${localstatedir}/lib/tee, and on
# a read-only rootfs /var/lib is a tmpfs courtesy of volatile-binds. The fTPM
# keeps its NV indexes, persistent handles and sealed blobs there, so leaving the
# default would give a TPM that silently forgets every key on reboot. It goes on
# the data partition.
OPTEE_FS_PARENT_PATH = "${IMX585_DATA_MOUNT}/tee"

# Boot the full DT built by imx585-devicetree and stack the IMX585 overlay on
# top of it. Carried from tegrademo.conf -- see PORTING.md, the R39 device tree
# names have not been re-checked.
UBOOT_EXTLINUX_FDT:jetson-orin-nano-devkit-nvme = "tegra234-p3768-0000+p3767-0005-oe4t.dtb"
UBOOT_EXTLINUX_FDTOVERLAYS:jetson-orin-nano-devkit-nvme = "imx585-overlay.dtbo"
OVERLAY_DTB_FILE:append:jetson-orin-nano-devkit-nvme = ",imx585-overlay.dtbo"

# Mount the rootfs read-only from the start. oe-core's read-only-rootfs image
# feature appends "ro" to APPEND, which has no effect on Tegra: extlinux.conf is
# generated by l4t-launcher-extlinux from UBOOT_EXTLINUX_KERNEL_ARGS, a different
# recipe, so the image's variables never reach it.
#
# This is set distro-wide although only imx585-minimal-image is read-only, because
# there is one extlinux.conf per build and it is shared. That is harmless for
# imx585-console-image: its /etc/fstab still says "defaults", and
# systemd-remount-fs remounts / read-write at boot accordingly.
UBOOT_EXTLINUX_KERNEL_ARGS:append = " ro"
