BBPATH =. "${LAYERDIR}:"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

# The container-host-config bbappend only makes sense when meta-virtualization is
# in bblayers. A plain bbappend would be a dangling append -- an error, not a
# warning -- on a build without an engine include, so it is keyed off that
# layer's collection name instead.
BBFILES_DYNAMIC += " \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/recipes-*/*/*.bb \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "imx585"
BBFILE_PATTERN_imx585 = "^${LAYERDIR}/"
BBFILE_PRIORITY_imx585 = "50"

LAYERVERSION_imx585 = "1"
LAYERDEPENDS_imx585 = "core tegra"
LAYERSERIES_COMPAT_imx585 = "wrynose"
