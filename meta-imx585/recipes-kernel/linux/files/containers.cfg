# Built in, not =m, so the podman overlay storage driver cannot fail on a missing
# module: this image installs named kernel-module-* packages rather than
# kernel-modules, so a module here would have to be tracked by hand.
# Native overlayfs also needs xattr support on the upper filesystem; the rootfs is
# ext4 and `xattr` is in DISTRO_FEATURES_DEFAULTS, so that is already satisfied.
CONFIG_OVERLAY_FS=y
