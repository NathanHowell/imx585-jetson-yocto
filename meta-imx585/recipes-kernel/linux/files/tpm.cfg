# Firmware TPM 2.0 over OP-TEE. meta-tegra's optee-nvsamples RDEPENDS
# kernel-module-tpm-ftpm-tee when OPTEE_ENABLE_FTPM is set, so this has to be a
# module or that package will not exist and the rootfs will fail to assemble.
CONFIG_TCG_TPM=y
CONFIG_TCG_FTPM_TEE=m

# The TEE bus the fTPM talks over. Present in NVIDIA's defconfig -- OP-TEE is the
# default virtual/secure-os provider on tegra234 -- but stated rather than assumed.
CONFIG_TEE=y
CONFIG_OPTEE=y
