# The CCI register accessors are required. Not because tegracam needs them --
# Kurokesu's nv_imx585.c does without -- but because our driver keeps
# will127534's cci_read/cci_write/CCI_REG8 register tables and replaces only the
# subdev layer above them.
#
# They cannot be enabled directly. In drivers/media/v4l2-core/Kconfig both are
# promptless:
#
#     config V4L2_CCI
#             tristate
#
#     config V4L2_CCI_I2C
#             tristate
#             depends on I2C
#             select REGMAP_I2C
#             select V4L2_CCI
#
# A promptless symbol is not user-settable, so "CONFIG_V4L2_CCI_I2C=y" in a
# fragment is silently discarded -- it is only ever turned on by another driver's
# `select`. Setting it directly produces no V4L2_CCI line in the built .config at
# all, not even "is not set", with no warning; cci_write() lives in v4l2-cci.c, so
# the module then builds and fails at modpost/load with cci_* undefined.
#
# So pull it in the only way available, via a driver that selects it. imx219 is
# the Jetson stock CSI camera, which also makes it the obvious known-good sensor
# for proving the VI/NVCSI path independently of the IMX585. Its only deps are
# the VIDEO_CAMERA_SENSOR menu (MEDIA_CAMERA_SUPPORT && I2C && HAVE_CLK), all
# already set. If this is ever removed, V4L2_CCI_I2C must be kept alive by some
# other selector or the IMX585 module loses its register accessors.
CONFIG_VIDEO_IMX219=m

# imx415 is the closest in-tree relative of the IMX585; handy for comparison.
# Note it does NOT select V4L2_CCI_I2C, so it cannot serve the role above.
CONFIG_VIDEO_IMX415=m

CONFIG_DYNAMIC_DEBUG=y
CONFIG_DYNAMIC_DEBUG_CORE=y

# StarlightEye on-board I2C peripherals (see imx585-overlay.dts).
#
# TMP117 is in drivers/iio/temperature, not hwmon -- it reports through IIO.
CONFIG_IIO=y
CONFIG_TMP117=m

# ICM-42688-P. Built even though the DT node is status="disabled": the module
# costs nothing unloaded, and it means enabling the node later (after routing
# INT1 -- see the overlay) does not also require a kernel rebuild.
CONFIG_INV_ICM42600=m
CONFIG_INV_ICM42600_I2C=m
