# Needed only by the upstream-style (non-tegracam) IMX585 driver, which uses
# the V4L2 CCI regmap helpers. The Kurokesu/tegracam driver does not need these.
CONFIG_V4L2_CCI=y
CONFIG_V4L2_CCI_I2C=y

# imx415 is the closest in-tree relative of the IMX585; handy for comparison.
CONFIG_VIDEO_IMX415=m

CONFIG_DYNAMIC_DEBUG=y
CONFIG_DYNAMIC_DEBUG_CORE=y
