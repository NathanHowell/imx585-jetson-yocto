# USB Audio Class support, for a USB mic/DAC passed through to a container.
# arm64 defconfig normally carries SND_USB_AUDIO=m already; this fragment makes
# that explicit rather than depending on it, since the base config here is
# whatever NVIDIA's l4t-r39.2.1 linux-noble branch ships as
# arch/arm64/configs/defconfig (KBUILD_DEFCONFIG = "defconfig",
# KCONFIG_MODE = "--alldefconfig").
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_USB=y
CONFIG_SND_USB_AUDIO=m
