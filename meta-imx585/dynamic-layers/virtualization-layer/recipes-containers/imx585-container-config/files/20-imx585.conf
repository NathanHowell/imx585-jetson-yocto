[containers]
# Containers are read-only by default. Anything that needs scratch space asks for
# it explicitly with --tmpfs or a volume, which is the point: a container that
# writes to its own image layer is storing state nobody will collect.
read_only = true

# Observability leaves the node, so cap what a misbehaving container can log into
# the volatile journal before it eats RAM.
log_size_max = 10485760

[engine]
# The CDI spec is regenerated into /run on every boot by
# nvidia-cdi-generate.service, so it tracks the installed L4T libraries and does
# not need a writable /etc. /etc/cdi is kept in the list so a spec baked into a
# future image would still be found.
cdi_spec_dirs = ["/etc/cdi", "@CDI_DIR@"]
