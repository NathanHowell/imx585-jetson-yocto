# Minimal headless image with podman. This is the recommended container build:
#
#   kas build kas/imx585.yml:kas/include/podman.yml
#
# podman only needs meta-virtualization. meta-tegra-community is NOT required --
# nvidia-container-toolkit and libnvidia-container live in meta-tegra itself,
# under external/virtualization-layer/, published through BBFILES_DYNAMIC as soon
# as the virtualization-layer collection exists.
#
# virtualization, seccomp and ipv6 are all already in DISTRO_FEATURES:
# virtualization from imx585.conf, seccomp and ipv6 from
# DISTRO_FEATURES_DEFAULTS. podman's features_check wants the latter two.
header:
  version: 14

repos:
  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization
    branch: wrynose

target:
  - imx585-minimal-image

local_conf_header:
  podman: |
    # Sets VIRTUAL-RUNTIME_container_{engine,runtime,networking,dns} to
    # podman/crun/netavark/aardvark-dns. Must be a hard assignment: layer.conf
    # already set CONTAINER_PROFILE ?= "default", and the profile include is
    # resolved later, by the meta-virt-container-cfg USER_CLASS.
    CONTAINER_PROFILE = "podman"

    IMX585_CONTAINER_ENGINE = "podman ca-certificates"

    # Smaller still, if containers only ever need --network=host: this drops
    # netavark and aardvark-dns, which are the two Rust binaries in the stack.
    # VIRTUAL-RUNTIME_container_networking = ""
    # VIRTUAL-RUNTIME_container_dns = ""

    # The storage driver is switched from meta-virtualization's vfs default to
    # overlay by meta-imx585's container-host-config bbappend, with
    # CONFIG_OVERLAY_FS=y from recipes-kernel/linux/files/containers.cfg. See
    # "Storage driver" in kas/README.md.

  containers-runtime: |
    # Running a CUDA container, with the camera and the USB audio device:
    #
    #   nvidia-ctk cdi generate --mode=csv --output=/etc/cdi/nvidia.yaml
    #   podman run --rm \
    #     --device nvidia.com/gpu=all \
    #     --device /dev/video0 --device /dev/snd \
    #     $(ls /dev/v4l-subdev* /dev/i2c-* | sed 's/^/--device /') \
    #     <image>
    #
    # CDI, not the docker runtime hook: nvidia-ctk writes a spec listing the host
    # libraries and device nodes to inject, and podman consumes it directly. The
    # alt-roots setting that makes CSV mode find the staged L4T libraries is
    # applied at boot by nvidia-container-setup.service.
