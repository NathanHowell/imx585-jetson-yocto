# Opt-in: docker + the NVIDIA container toolkit, as the old orin-console-image
# had. Dropped from the default build because it pulls in two more layers and
# none of it is needed to get a sensor streaming.
#
#   kas build kas/imx585.yml:kas/include/containers.yml
header:
  version: 14

repos:
  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization
    branch: wrynose

  meta-tegra-community:
    url: https://github.com/OE4T/meta-tegra-community
    branch: wrynose

local_conf_header:
  containers: |
    DISTRO_FEATURES:append = " virtualization"
    IMAGE_INSTALL:append = " docker-moby nvidia-container-toolkit"
    VIRTUAL-RUNTIME_container_engine ?= "docker"
    VIRTUAL-RUNTIME_container_runtime ?= "virtual-runc"
